name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (build, lint, test)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: centralizacion
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: centralization

    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://127.0.0.1:3306/centralizacion?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ci_test_password
      JWT_SECRET: ci-only-secret-not-used-outside-this-workflow
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      N8N_WEBHOOK_URL: https://ci-placeholder.invalid/webhook

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: centralization/pom.xml

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -pci_test_password --silent && break
            sleep 2
          done

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: centralization/target/surefire-reports

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: centralization-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: centralization-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build
