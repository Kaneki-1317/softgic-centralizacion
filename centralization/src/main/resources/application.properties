spring.application.name=centralization
server.port=8081

# Perfil activo — SIN valor por defecto a propósito: si SPRING_PROFILES_ACTIVE
# no está seteado, el arranque debe fallar aquí mismo (antes de tocar la base
# de datos) en vez de caer silenciosamente en un perfil no intencionado.
# Local: ver spring-boot.run.profiles en pom.xml y .vscode/launch.json.
# Producción: SPRING_PROFILES_ACTIVE=prod es obligatorio.
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# ── Base de Datos ─────────────────────────────────────────────────────────────
# DB_PASSWORD sin valor por defecto a propósito: un default como "changeme"
# permitiría arrancar (e intentar conectar) con una contraseña adivinable si
# la variable de entorno falta, en vez de fallar de forma explícita. La URL y
# el usuario sí mantienen defaults de conveniencia local (no son el secreto).
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/centralizacion?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
# baseline-on-migrate: marca la BD existente como baseline sin ejecutar V1
# baseline-version=1: las BDs existentes ya tienen V1 implícitamente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:PLACEHOLDER_REPLACE_IN_PROD}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Rate limiting de login ──────────────────────────────────────────────────────
# X-Forwarded-For solo es confiable si hay un proxy/load balancer de confianza
# delante que lo sobrescribe. Por defecto NO se confía en ese header (se usa la
# IP real de la conexión TCP) para no ser evadible mandando un header falso.
# Activar solo si el despliegue realmente tiene un proxy de confianza delante.
app.security.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}

# ── n8n (analisis de documentos) ───────────────────────────────────────────────
# La URL incluye un identificador que funciona como credencial de acceso al
# webhook — NO debe tener un valor real por defecto en un archivo versionado.
# El placeholder usa el TLD reservado .invalid (RFC 2606): si N8N_WEBHOOK_URL
# no está seteada, cualquier intento de análisis de documento falla rápido y
# con un error claro de conexión, en vez de silenciosamente usar un webhook
# ajeno. Configurar el valor real solo vía variable de entorno.
n8n.webhook.url=${N8N_WEBHOOK_URL:https://REPLACE_WITH_REAL_N8N_WEBHOOK_URL.invalid/webhook}
n8n.webhook.timeout-ms=${N8N_TIMEOUT_MS:60000}
n8n.webhook.connect-timeout-ms=${N8N_CONNECT_TIMEOUT_MS:5000}
n8n.document-analysis.max-file-size-bytes=${N8N_MAX_FILE_SIZE_BYTES:20971520}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.softgic.centralization=INFO

# ── Errores HTTP ──────────────────────────────────────────────────────────────
# Una ruta inexistente debe lanzar NoHandlerFoundException (y la captura
# GlobalExceptionHandler con el mismo formato que el resto de la API) en vez
# de que Spring intente resolverla como un recurso estático. En esta versión
# de Spring Boot el DispatcherServlet ya lanza la excepción por defecto; solo
# hace falta desactivar el mapeo de recursos estáticos (no se sirve ninguno).
spring.web.resources.add-mappings=false

# ── Actuator / Health checks ─────────────────────────────────────────────────
# Solo se expone "health" (nunca env/beans/mappings, que filtrarían detalles
# internos). show-details=never es el default y se deja explícito: el estado
# UP/DOWN es público (para el orquestador), el detalle interno no.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
