spring.application.name=centralization

# Perfil activo — sobreescribir con SPRING_PROFILES_ACTIVE=prod en produccion
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Base de Datos ─────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/centralizacion?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
# baseline-on-migrate: marca la BD existente como baseline sin ejecutar V1
# baseline-version=1: las BDs existentes ya tienen V1 implícitamente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:PLACEHOLDER_REPLACE_IN_PROD}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
