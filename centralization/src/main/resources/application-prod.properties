# ══════════════════════════════════════════════════════════════════════════════
# PERFIL DE PRODUCCIÓN — todos los valores deben venir de variables de entorno
# Activar con: SPRING_PROFILES_ACTIVE=prod
# ══════════════════════════════════════════════════════════════════════════════

# JPA — sin SQL en logs de producción, esquema solo validado (no modificado)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# CORS — reemplazar con el dominio real del frontend en producción
# Ejemplo: CORS_ALLOWED_ORIGINS=https://casos.softgic.com
# La variable de entorno CORS_ALLOWED_ORIGINS DEBE estar definida.

# Variables de entorno obligatorias en este perfil (ninguna tiene default
# funcional en application.properties; el arranque falla o el análisis de
# documentos falla rápido si faltan):
#   DB_PASSWORD        — sin default: el arranque falla si falta.
#   JWT_SECRET          — sin default válido: el arranque falla si falta.
#   CORS_ALLOWED_ORIGINS — sin esto, ningún origen real podrá llamar a la API.
#   N8N_WEBHOOK_URL      — sin esto, "Crear desde Documento" falla al primer uso.
