# ══════════════════════════════════════════════════════════════════════════════
# PERFIL DE PRODUCCIÓN — todos los valores deben venir de variables de entorno
# Activar con: SPRING_PROFILES_ACTIVE=prod
# ══════════════════════════════════════════════════════════════════════════════

# JPA — sin SQL en logs de producción, esquema solo validado (no modificado)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# CORS — reemplazar con el dominio real del frontend en producción
# Ejemplo: CORS_ALLOWED_ORIGINS=https://casos.softgic.com
# La variable de entorno CORS_ALLOWED_ORIGINS DEBE estar definida.
